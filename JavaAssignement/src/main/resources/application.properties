spring.application.name=student-management-api
server.port=8081

# ------------------------------------------------------------------
# MySQL database configuration
# Update the username/password to match your local MySQL installation.
# Create the database first:  CREATE DATABASE student_db;
# ------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/student_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=YourPrivatePassword123!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=update lets Hibernate create/update the "students" table.
# Use "validate" in production after managing schema with migrations.
# ------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------------
# JSON
# ------------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
